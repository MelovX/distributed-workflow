apiVersion: v1
kind: Service
metadata:
  name: registration-postgres
  namespace: distributed-workflow
spec:
  clusterIP: None
  selector:
    app: registration-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: registration-postgres
  namespace: distributed-workflow
spec:
  serviceName: registration-postgres
  replicas: 1

  selector:
    matchLabels:
      app: registration-postgres

  template:
    metadata:
      labels:
        app: registration-postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16

          args:
            - postgres
            - -c
            - shared_buffers=1GB
            - -c
            - checkpoint_timeout=15min
            - -c
            - checkpoint_completion_target=0.9
            - -c
            - wal_buffers=16MB

          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: registration_db

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: database-settings
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-settings
                  key: POSTGRES_PASSWORD

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d registration_db
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d registration_db
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
