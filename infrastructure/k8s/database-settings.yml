apiVersion: v1
kind: Secret
metadata:
  name: database-settings
  namespace: distributed-workflow
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  REGISTRATION_CONNECTION_STRING: Host=registration-postgres;Port=5432;Database=registration_db;Username=postgres;Password=postgres;Timeout=5
  WORKER_CONNECTION_STRING: Host=worker-postgres;Port=5432;Database=worker_db;Username=postgres;Password=postgres;Timeout=5