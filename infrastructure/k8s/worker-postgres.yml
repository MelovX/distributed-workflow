apiVersion: v1
kind: Service
metadata:
  name: worker-postgres
  namespace: distributed-workflow
spec:
  clusterIP: None
  selector:
    app: worker-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: worker-postgres
  namespace: distributed-workflow
spec:
  serviceName: worker-postgres
  replicas: 1

  selector:
    matchLabels:
      app: worker-postgres

  template:
    metadata:
      labels:
        app: worker-postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16

          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: worker_db

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: database-settings
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-settings
                  key: POSTGRES_PASSWORD

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d worker_db
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d worker_db
            initialDelaySeconds: 20
            periodSeconds: 10

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi