services:
    rabbitmq:
        image: rabbitmq:3-management
        container_name: distributed-workflow-rabbitmq
        volumes:
            - ./observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
            - ./observability/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
            - ./observability/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
        ports:
            - "5673:5672"
            - "15672:15672"
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s

    postgres:
        image: postgres:16
        container_name: distributed-workflow-postgres
        command:
            - postgres
            - -c
            - shared_buffers=1GB
            - -c
            - max_wal_size=8GB
            - -c
            - checkpoint_timeout=15min
            - -c
            - checkpoint_completion_target=0.9
            - -c
            - wal_buffers=16MB
        ports:
            - "5433:5432"
        environment:
            POSTGRES_DB: registration_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d registration_db"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 5s
            
    worker-postgres:
        image: postgres:16
        container_name: distributed-workflow-worker-postgres
        ports:
            - "5434:5432"
        environment:
            POSTGRES_DB: worker_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - worker-postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d worker_db"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 5s
            
    migrations:
        profiles:
            - apps
        image: distributed-workflow-migrations:local
        build:
            context: .
            dockerfile: DistributedWorkflow.Migrations/Dockerfile
        container_name: distributed-workflow-migrations
        environment:
            ConnectionStrings__RegistrationDb: Host=postgres;Port=5432;Database=registration_db;Username=postgres;Password=postgres;Maximum Pool Size=5;Minimum Pool Size=0;Connection Idle Lifetime=60;Connection Pruning Interval=10;Timeout=5
            ConnectionStrings__WorkerDb: Host=worker-postgres;Port=5432;Database=worker_db;Username=postgres;Password=postgres;Maximum Pool Size=5;Minimum Pool Size=0;Connection Idle Lifetime=60;Connection Pruning Interval=10;Timeout=5
        depends_on:
            postgres:
                condition: service_healthy
            worker-postgres:
                condition: service_healthy
        restart: "no"

    prometheus:
        image: prom/prometheus
        container_name: distributed-workflow-prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
            - prometheus-data:/prometheus

    grafana:
        image: grafana/grafana
        container_name: distributed-workflow-grafana
        ports:
            - "3000:3000"
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin
        volumes:
            - grafana-data:/var/lib/grafana
            - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
            - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
            - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

    redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:latest
        container_name: distributed-workflow-redpanda
        command:
            - redpanda
            - start
            - --kafka-addr
            - internal://0.0.0.0:9092,external://0.0.0.0:19092
            - --advertise-kafka-addr
            - internal://redpanda:9092,external://localhost:19092
            - --mode
            - dev-container
            - --smp
            - "1"
        ports:
            - "19092:19092"
            - "9644:9644"
        volumes:
            - redpanda-data:/var/lib/redpanda/data
        healthcheck:
            test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 5s

    redpanda-console:
        image: docker.redpanda.com/redpandadata/console:latest
        container_name: distributed-workflow-redpanda-console
        depends_on:
            redpanda:
                condition: service_healthy
        ports:
            - "8080:8080"
        environment:
            KAFKA_BROKERS: redpanda:9092
            REDPANDA_ADMINAPI_ENABLED: true
            REDPANDA_ADMINAPI_URLS: http://redpanda:9644

    redpanda-init:
        image: docker.redpanda.com/redpandadata/redpanda:latest
        entrypoint: ["rpk"]
        command:
            - topic
            - create
            - document-registered
            - --partitions
            - "12"
            - --replicas
            - "1"
            - --if-not-exists
            - -X
            - brokers=redpanda:9092
        depends_on:
            redpanda:
                condition: service_healthy
        restart: "no"
    
    numbering-grpc:
        profiles:
            - apps
        image: distributed-workflow-numbering-grpc:local
        build:
            context: .
            dockerfile: DistributedWorkflow.Numbering.Grpc/Dockerfile
        container_name: distributed-workflow-numbering-grpc
        environment:
            ASPNETCORE_ENVIRONMENT: Production
            ASPNETCORE_URLS: http://+:8080
        ports:
            - "5082:8080"
    
    worker:
        profiles:
            - apps
        image: distributed-workflow-worker:local
        build:
            context: .
            dockerfile: DistributedWorkflow.Worker/Dockerfile
        deploy:
            replicas: 4
        environment:
            DOTNET_ENVIRONMENT: Production
            RabbitMq__HostName: rabbitmq
            RabbitMq__Port: 5672
            RabbitMq__UserName: guest
            RabbitMq__Password: guest
            RabbitMq__ConsumerConcurrency: 64
            WorkerBatch__MaxBatchSize: 32
            WorkerBatch__MaxBatchDelay: "00:00:00.005"
            WorkerBatch__Capacity: 2048
            NumberingGrpc__Address: http://numbering-grpc:8080
            ASPNETCORE_URLS: http://+:8080
            ConnectionStrings__WorkerDb: Host=worker-postgres;Port=5432;Database=worker_db;Username=postgres;Password=postgres;Maximum Pool Size=20;Minimum Pool Size=0;Connection Idle Lifetime=60;Connection Pruning Interval=10;Timeout=5
        depends_on:
            rabbitmq:
                condition: service_healthy
            numbering-grpc:
                condition: service_started
            migrations:
                condition: service_completed_successfully
        restart: unless-stopped
    
    api:
        profiles:
            - apps
        image: distributed-workflow-api:local
        build:
            context: .
            dockerfile: DistributedWorkflow.Api/Dockerfile
        deploy:
            replicas: 3
        environment:
            ASPNETCORE_ENVIRONMENT: Production
            ASPNETCORE_URLS: http://+:8080
            ConnectionStrings__RegistrationDb: Host=postgres;Port=5432;Database=registration_db;Username=postgres;Password=postgres;Maximum Pool Size=20;Minimum Pool Size=0;Connection Idle Lifetime=60;Connection Pruning Interval=10;Timeout=5
            RegistrationBatch__MaxBatchSize: 64
            RegistrationBatch__MaxBatchDelay: "00:00:00.005"
            RegistrationBatch__Capacity: 20000
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 15s
        depends_on:
            postgres:
                condition: service_healthy
            migrations:
                condition: service_completed_successfully
        restart: on-failure

    load-balancer:
        profiles:
            - apps
        image: haproxy:3.2-alpine
        container_name: distributed-workflow-load-balancer
        ports:
            - "5268:8080"
            - "8404:8404"
        volumes:
            - ./infrastructure/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8404/metrics"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s
        depends_on:
            api:
                condition: service_healthy
        restart: unless-stopped

    outbox-publisher:
        profiles:
            - apps
        image: distributed-workflow-outbox-publisher:local
        build:
            context: .
            dockerfile: DistributedWorkflow.OutboxPublisher/Dockerfile
        deploy:
            replicas: 2
        environment:
            ASPNETCORE_ENVIRONMENT: Production
            ASPNETCORE_URLS: http://+:8080
            ConnectionStrings__OutboxDb: Host=postgres;Port=5432;Database=registration_db;Username=postgres;Password=postgres;Maximum Pool Size=5;Minimum Pool Size=0;Connection Idle Lifetime=60;Connection Pruning Interval=10;Timeout=5
            RabbitMq__HostName: rabbitmq
            RabbitMq__Port: 5672
            RabbitMq__UserName: guest
            RabbitMq__Password: guest
            Outbox__DispatcherCount: 3
            Outbox__BatchSize: 100
            Outbox__LeaseDuration: "00:00:20"
            Outbox__EmptyBatchDelay: "00:00:00.100"
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 15s
        depends_on:
            postgres:
                condition: service_healthy
            migrations:
                condition: service_completed_successfully
            rabbitmq:
                condition: service_healthy
        restart: on-failure

    kafka-outbox-publisher:
        profiles:
            - apps
        image: distributed-workflow-kafka-outbox-publisher:local
        build:
            context: .
            dockerfile: DistributedWorkflow.KafkaOutboxPublisher/Dockerfile
        deploy:
            replicas: 2
        environment:
            ASPNETCORE_ENVIRONMENT: Production
            ASPNETCORE_URLS: http://+:8080
            ConnectionStrings__WorkerDb: Host=worker-postgres;Port=5432;Database=worker_db;Username=postgres;Password=postgres;Maximum Pool Size=5;Minimum Pool Size=0;Connection Idle Lifetime=60;Connection Pruning Interval=10;Timeout=5
            Kafka__BootstrapServers: redpanda:9092
            Kafka__TopicName: document-registered
            Outbox__DispatcherCount: 2
            Outbox__BatchSize: 500
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 20s
        depends_on:
            worker-postgres:
                condition: service_healthy
            migrations:
                condition: service_completed_successfully
            redpanda-init:
                condition: service_completed_successfully
        restart: on-failure

    registration-status-updater:
        profiles:
            - apps
        image: distributed-workflow-registration-status-updater:local
        build:
            context: .
            dockerfile: DistributedWorkflow.RegistrationStatusUpdater/Dockerfile
        deploy:
            replicas: 2
        environment:
            ASPNETCORE_ENVIRONMENT: Production
            ASPNETCORE_URLS: http://+:8080
            ConnectionStrings__RegistrationDb: Host=postgres;Port=5432;Database=registration_db;Username=postgres;Password=postgres;Maximum Pool Size=5;Minimum Pool Size=0;Connection Idle Lifetime=60;Connection Pruning Interval=10;Timeout=5
            Kafka__BootstrapServers: redpanda:9092
            Kafka__TopicName: document-registered
            Kafka__GroupId: registration-status-updater
            Kafka__ConsumerCount: 2
            Kafka__BatchSize: 500
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 20s
        depends_on:
            postgres:
                condition: service_healthy
            migrations:
                condition: service_completed_successfully
            redpanda-init:
                condition: service_completed_successfully
        restart: on-failure

volumes:
    postgres-data:
    worker-postgres-data:
    redpanda-data:
    prometheus-data:
    grafana-data:
