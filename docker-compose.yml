services:
    redis:
        image: redis:7
        container_name: interview-redis
        ports:
            - "6379:6379"

    rabbitmq:
        image: rabbitmq:3-management
        container_name: interview-rabbitmq
        ports:
            - "5673:5672"
            - "15672:15672"

    postgres:
        image: postgres:16
        container_name: interview-postgres
        ports:
            - "5433:5432"
        environment:
            POSTGRES_DB: registration_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - postgres-data:/var/lib/postgresql/data

    prometheus:
        image: prom/prometheus
        container_name: interview-prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml

    grafana:
        image: grafana/grafana
        container_name: interview-grafana
        ports:
            - "3000:3000"
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin

    redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:latest
        container_name: interview-redpanda
        command:
            - redpanda
            - start
            - --kafka-addr
            - internal://0.0.0.0:9092,external://0.0.0.0:19092
            - --advertise-kafka-addr
            - internal://redpanda:9092,external://localhost:19092
            - --mode
            - dev-container
            - --smp
            - "1"
        ports:
            - "19092:19092"
            - "9644:9644"
        volumes:
            - redpanda-data:/var/lib/redpanda/data

    redpanda-console:
        image: docker.redpanda.com/redpandadata/console:latest
        container_name: interview-redpanda-console
        depends_on:
            - redpanda
        ports:
            - "8080:8080"
        environment:
            KAFKA_BROKERS: redpanda:9092
            REDPANDA_ADMINAPI_ENABLED: true
            REDPANDA_ADMINAPI_URLS: http://redpanda:9644

volumes:
    postgres-data:
    redpanda-data:
