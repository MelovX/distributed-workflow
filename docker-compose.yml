services:
    redis:
        image: redis:7
        container_name: distributed-workflow-redis
        ports:
            - "6379:6379"

    rabbitmq:
        image: rabbitmq:3-management
        container_name: distributed-workflow-rabbitmq
        volumes:
            - ./observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
        ports:
            - "5673:5672"
            - "15672:15672"
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s

    postgres:
        image: postgres:16
        container_name: distributed-workflow-postgres
        command:
            - postgres
            - -c
            - shared_buffers=1GB
            - -c
            - max_wal_size=8GB
            - -c
            - checkpoint_timeout=15min
            - -c
            - checkpoint_completion_target=0.9
            - -c
            - wal_buffers=16MB
        ports:
            - "5433:5432"
        environment:
            POSTGRES_DB: registration_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d registration_db"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 5s
            
    migrations:
        profiles:
            - apps
        image: distributed-workflow-api:local
        container_name: distributed-workflow-migrations
        environment:
            ASPNETCORE_ENVIRONMENT: Production
            RunMigrations: "true"
            ConnectionStrings__RegistrationDb: Host=postgres;Port=5432;Database=registration_db;Username=postgres;Password=postgres;Maximum Pool Size=5;Minimum Pool Size=0;Connection Idle Lifetime=60;Connection Pruning Interval=10;Timeout=5
        depends_on:
            postgres:
                condition: service_healthy
        restart: "no"

    prometheus:
        image: prom/prometheus
        container_name: distributed-workflow-prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
            - prometheus-data:/prometheus

    grafana:
        image: grafana/grafana
        container_name: distributed-workflow-grafana
        ports:
            - "3000:3000"
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin
        volumes:
            - grafana-data:/var/lib/grafana
            - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
            - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
            - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

    redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:latest
        container_name: distributed-workflow-redpanda
        command:
            - redpanda
            - start
            - --kafka-addr
            - internal://0.0.0.0:9092,external://0.0.0.0:19092
            - --advertise-kafka-addr
            - internal://redpanda:9092,external://localhost:19092
            - --mode
            - dev-container
            - --smp
            - "1"
        ports:
            - "19092:19092"
            - "9644:9644"
        volumes:
            - redpanda-data:/var/lib/redpanda/data

    redpanda-console:
        image: docker.redpanda.com/redpandadata/console:latest
        container_name: distributed-workflow-redpanda-console
        depends_on:
            - redpanda
        ports:
            - "8080:8080"
        environment:
            KAFKA_BROKERS: redpanda:9092
            REDPANDA_ADMINAPI_ENABLED: true
            REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    
    analytics:
        profiles:
            - apps
        image: distributed-workflow-analytics:local
        build:
            context: .
            dockerfile: DistributedWorkflow.Analytics/Dockerfile
        container_name: distributed-workflow-analytics
        environment:
            DOTNET_ENVIRONMENT: Production
            Kafka__BootstrapServers: redpanda:9092
            Kafka__TopicName: document-registered
            Kafka__GroupId: analytics-service
        depends_on:
            - redpanda
    
    numbering-grpc:
        profiles:
            - apps
        image: distributed-workflow-numbering-grpc:local
        build:
            context: .
            dockerfile: DistributedWorkflow.Numbering.Grpc/Dockerfile
        container_name: distributed-workflow-numbering-grpc
        environment:
            ASPNETCORE_ENVIRONMENT: Production
            ASPNETCORE_URLS: http://+:8080
        ports:
            - "5082:8080"
    
    worker:
        profiles:
            - apps
        image: distributed-workflow-worker:local
        build:
            context: .
            dockerfile: DistributedWorkflow.Worker/Dockerfile
        environment:
            DOTNET_ENVIRONMENT: Production
            RabbitMq__HostName: rabbitmq
            RabbitMq__Port: 5672
            RabbitMq__UserName: guest
            RabbitMq__Password: guest
            RabbitMq__ConsumerConcurrency: 24
            Kafka__BootstrapServers: redpanda:9092
            Kafka__TopicName: document-registered
            NumberingGrpc__Address: http://numbering-grpc:8080
            ASPNETCORE_URLS: http://+:8080
        depends_on:
            rabbitmq:
                condition: service_healthy
            redpanda:
                condition: service_started
            numbering-grpc:
                condition: service_started
        restart: unless-stopped
    
    api:
        profiles:
            - apps
        image: distributed-workflow-api:local
        build:
            context: .
            dockerfile: DistributedWorkflow.Api/Dockerfile
        deploy:
            replicas: 3
        environment:
            ASPNETCORE_ENVIRONMENT: Production
            ASPNETCORE_URLS: http://+:8080
            ConnectionStrings__RegistrationDb: Host=postgres;Port=5432;Database=registration_db;Username=postgres;Password=postgres;Maximum Pool Size=25;Minimum Pool Size=0;Connection Idle Lifetime=60;Connection Pruning Interval=10;Timeout=5
            ConnectionStrings__Redis: redis:6379
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 15s
        depends_on:
            postgres:
                condition: service_healthy
            migrations:
                condition: service_completed_successfully
            redis:
                condition: service_started
        restart: on-failure

    load-balancer:
        profiles:
            - apps
        image: haproxy:3.2-alpine
        container_name: distributed-workflow-load-balancer
        ports:
            - "5268:8080"
            - "8404:8404"
        volumes:
            - ./infrastructure/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8404/metrics"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s
        depends_on:
            api:
                condition: service_healthy
        restart: unless-stopped

    outbox-publisher:
        profiles:
            - apps
        image: distributed-workflow-outbox-publisher:local
        build:
            context: .
            dockerfile: DistributedWorkflow.OutboxPublisher/Dockerfile
        environment:
            ASPNETCORE_ENVIRONMENT: Production
            ASPNETCORE_URLS: http://+:8080
            ConnectionStrings__OutboxDb: Host=postgres;Port=5432;Database=registration_db;Username=postgres;Password=postgres;Maximum Pool Size=5;Minimum Pool Size=0;Connection Idle Lifetime=60;Connection Pruning Interval=10;Timeout=5
            RabbitMq__HostName: rabbitmq
            RabbitMq__Port: 5672
            RabbitMq__UserName: guest
            RabbitMq__Password: guest
            Outbox__DispatcherCount: 8
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 15s
        depends_on:
            postgres:
                condition: service_healthy
            migrations:
                condition: service_completed_successfully
            rabbitmq:
                condition: service_healthy
        restart: on-failure

volumes:
    postgres-data:
    redpanda-data:
    prometheus-data:
    grafana-data:
